<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使用文档 · 硫系存储材料数据库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --plane:#f7f8fa; --surface:#ffffff; --soft:#f6f6f7; --ink:#1b1b1f; --ink2:#4b4b52; --muted:#8a8a91;
  --grid:#ececee; --border:#e6e6e8; --series:#2f74dd; --series-soft:#e6effc; --accent2:#6366f1; --brand-3:#1e5bb8;
  --grad:linear-gradient(120deg,#2f74dd 15%,#6366f1);
  --sh1:0 1px 2px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --sh2:0 3px 12px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.05);
  --sh3:0 12px 32px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.08);
  --glow:rgba(47,116,221,.11);
  --fn-pcm:#1e5bb8; --fn-ots:#1f8f5f; --fn-som:#7a3fc0; --fn-cand:#b3701a; --fn-other:#6b7280;
}
@media (prefers-color-scheme:dark){:root{
  --plane:#161618; --surface:#202127; --soft:#1b1b1f; --ink:#f5f5f7; --ink2:#c9c9cf; --muted:#8a8a91;
  --grid:#2c2c30; --border:rgba(255,255,255,0.10); --series:#4a9eff; --series-soft:#16324f; --accent2:#8b9bff; --brand-3:#8cc2ff;
  --grad:linear-gradient(120deg,#4a9eff 15%,#8b9bff);
  --sh1:0 1px 2px rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.3);
  --sh2:0 3px 12px rgba(0,0,0,.3),0 1px 4px rgba(0,0,0,.3);
  --sh3:0 12px 32px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);
  --glow:rgba(74,158,255,.13);
  --fn-pcm:#8cc2ff; --fn-ots:#5fd39a; --fn-som:#c4a3f0; --fn-cand:#f0b566; --fn-other:#9aa0aa;
}}
:root[data-theme=dark]{
  --plane:#161618; --surface:#202127; --soft:#1b1b1f; --ink:#f5f5f7; --ink2:#c9c9cf; --muted:#8a8a91;
  --grid:#2c2c30; --border:rgba(255,255,255,0.10); --series:#4a9eff; --series-soft:#16324f; --accent2:#8b9bff; --brand-3:#8cc2ff;
  --grad:linear-gradient(120deg,#4a9eff 15%,#8b9bff);
  --sh1:0 1px 2px rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.3);
  --sh2:0 3px 12px rgba(0,0,0,.3),0 1px 4px rgba(0,0,0,.3);
  --sh3:0 12px 32px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);
  --glow:rgba(74,158,255,.13);
  --fn-pcm:#8cc2ff; --fn-ots:#5fd39a; --fn-som:#c4a3f0; --fn-cand:#f0b566; --fn-other:#9aa0aa;
}
:root[data-theme=light]{
  --plane:#f7f8fa; --surface:#ffffff; --soft:#f6f6f7; --ink:#1b1b1f; --ink2:#4b4b52; --muted:#8a8a91;
  --grid:#ececee; --border:#e6e6e8; --series:#2f74dd; --series-soft:#e6effc; --accent2:#6366f1; --brand-3:#1e5bb8;
  --grad:linear-gradient(120deg,#2f74dd 15%,#6366f1);
  --sh1:0 1px 2px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --sh2:0 3px 12px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.05);
  --sh3:0 12px 32px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.08);
  --glow:rgba(47,116,221,.11);
  --fn-pcm:#1e5bb8; --fn-ots:#1f8f5f; --fn-som:#7a3fc0; --fn-cand:#b3701a; --fn-other:#6b7280;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plane);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html{scroll-behavior:smooth}
a{color:var(--series);text-decoration:none}a:hover{text-decoration:underline}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;
  background:var(--soft);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.topbar{position:absolute;top:18px;right:20px;display:flex;gap:8px;z-index:5}
.tbtn{background:var(--surface);color:var(--ink2);border:1px solid var(--border);border-radius:9px;
  padding:7px 13px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;
  box-shadow:var(--sh1);transition:color .15s,border-color .15s,box-shadow .15s,transform .15s;text-decoration:none;display:inline-block}
.tbtn:hover{color:var(--series);border-color:var(--series);box-shadow:var(--sh2);text-decoration:none}
.tbtn:active{transform:translateY(1px)}
header{position:relative;padding:56px 0 24px;overflow:hidden}
header::before{content:"";position:absolute;top:-160px;left:-80px;width:520px;height:360px;
  background:radial-gradient(closest-side,var(--glow),transparent 70%);pointer-events:none;z-index:0}
header>*{position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--series);font-weight:700}
h1{font-size:clamp(32px,5vw,46px);line-height:1.08;margin:.26em 0 .18em;letter-spacing:-.025em;font-weight:800;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--ink2);max-width:70ch;font-size:16px;line-height:1.65}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding:14px 0 64px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:8px}.toc{display:none}}
.toc{position:sticky;top:24px;align-self:start}
.toc .toc-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px;padding-left:12px}
.toc a{display:block;color:var(--ink2);font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:8px;
  border-left:2px solid transparent;transition:color .15s,background .15s,border-color .15s}
.toc a:hover{color:var(--series);background:var(--soft);text-decoration:none}
.toc a.active{color:var(--series);border-left-color:var(--series);background:var(--series-soft);font-weight:600}

.doc section{padding:26px 0;scroll-margin-top:20px}
.doc section+section{border-top:1px solid var(--border)}
h2{font-size:24px;letter-spacing:-.015em;margin:0 0 6px;font-weight:750;display:flex;align-items:baseline;gap:12px}
h2 .num{font-size:14px;font-weight:700;color:var(--series);font-variant-numeric:tabular-nums;
  background:var(--series-soft);border-radius:7px;padding:2px 9px;letter-spacing:0}
.lead{color:var(--ink2);font-size:15.5px;max-width:76ch;margin:0 0 18px}
.doc p{color:var(--ink2);max-width:76ch}
.doc ul{color:var(--ink2);max-width:76ch;padding-left:20px}
.doc li{margin:5px 0}
.doc b,.doc strong{color:var(--ink);font-weight:650}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;
  box-shadow:var(--sh2);margin:16px 0}
.card h3{font-size:14.5px;margin:0 0 8px;font-weight:650;color:var(--ink)}
.card p{margin:0;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.grid2 .card{margin:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:6px 0 4px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--sh2)}
.stat .v{font-size:28px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500}

.shot{margin:8px 0 4px;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--sh3);background:var(--surface)}
.shot img{display:block;width:100%;height:auto}
.cap{color:var(--muted);font-size:12.5px;margin:10px 2px 0}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tag{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}
.tag.pcm{color:var(--fn-pcm)} .tag.ots{color:var(--fn-ots)} .tag.som{color:var(--fn-som)}
.tag.cand{color:var(--fn-cand)} .tag.other{color:var(--fn-other)}
.tag.amor{color:var(--series)} .tag.cryst{color:var(--accent2)}

.steps{counter-reset:step;list-style:none;padding:0;margin:16px 0;max-width:76ch}
.steps li{position:relative;padding:2px 0 14px 40px;color:var(--ink2)}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;
  width:26px;height:26px;border-radius:50%;background:var(--series-soft);color:var(--series);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:28px;bottom:2px;width:1.5px;background:var(--border)}

.note{background:var(--series-soft);border:1px solid var(--border);border-left:3px solid var(--series);
  border-radius:10px;padding:13px 16px;margin:16px 0;font-size:14px;color:var(--ink2);max-width:76ch}
.note b{color:var(--ink)}
footer{border-top:1px solid var(--border);padding:26px 0 50px;color:var(--muted);font-size:13px}
.backrow{margin-top:28px}
</style>
</head>
<body>
<div class="topbar">
  <a class="tbtn" id="homeBtn" href="index.html" data-i18n="back"></a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">◐</button>
</div>

<header>
  <div class="wrap">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="intro"></p>
  </div>
</header>

<div class="wrap">
  <div class="layout">

      <a href="#filter" data-i18n="nav_filter"></a>
      <a href="#viz" data-i18n="nav_viz"></a>
      <a href="#mlip" data-i18n="nav_mlip"></a>
      <a href="#contribute" data-i18n="nav_contribute"></a>
    </nav>

    <main class="doc">
      <!-- 0 概览 -->
      <section id="overview">
        <h2><span class="num">0</span><span data-i18n="s0_h"></span></h2>
        <p class="lead" data-i18n="s0_lead"></p>
        <div class="stats">
          <div class="stat"><div class="v">16944</div><div class="l" data-i18n="st_total"></div></div>
          <div class="stat"><div class="v">247</div><div class="l" data-i18n="st_sys"></div></div>
          <div class="stat"><div class="v">3</div><div class="l" data-i18n="st_phase"></div></div>
          <div class="stat"><div class="v">4</div><div class="l" data-i18n="st_mlip"></div></div>
        </div>
        <div class="tags">
          <span class="tag amor" data-i18n="tg_amor"></span>
          <span class="tag cryst" data-i18n="tg_cryst"></span>
          <span class="tag pcm">PCM</span>
          <span class="tag ots">OTS</span>
          <span class="tag som">SOM</span>
          <span class="tag cand" data-i18n="tg_cand"></span>
        </div>
        <div class="shot"><img src="assets/database_0.png" alt="database preview"></div>
        <p class="cap" data-i18n="s0_cap"></p>
      </section>

      <!-- 1 数据查询 -->
      <section id="query">
        <h2><span class="num">1</span><span data-i18n="s1_h"></span></h2>
        <p class="lead" data-i18n="s1_lead"></p>
        <div class="grid2">
          <div class="card"><h3 data-i18n="s1_c1_h"></h3><p data-i18n="s1_c1_p"></p></div>
          <div class="card"><h3 data-i18n="s1_c2_h"></h3><p data-i18n="s1_c2_p"></p></div>
          <div class="card"><h3 data-i18n="s1_c3_h"></h3><p data-i18n="s1_c3_p"></p></div>
        </div>
        <p data-i18n="s1_meta"></p>
      </section>

      <!-- 2 数据筛选 -->
      <section id="filter">
        <h2><span class="num">2</span><span data-i18n="s2_h"></span></h2>
        <p class="lead" data-i18n="s2_lead"></p>
        <ul>
          <li data-i18n="s2_l1"></li>
          <li data-i18n="s2_l2"></li>
          <li data-i18n="s2_l3"></li>
          <li data-i18n="s2_l4"></li>
        </ul>
        <div class="note" data-i18n="s2_note"></div>
      </section>

      <!-- 3 分布可视化 -->
      <section id="viz">
        <h2><span class="num">3</span><span data-i18n="s3_h"></span></h2>
        <p class="lead" data-i18n="s3_lead"></p>
        <ol class="steps">
          <li data-i18n="s3_s1"></li>
          <li data-i18n="s3_s2"></li>
          <li data-i18n="s3_s3"></li>
        </ol>
        <div class="note" data-i18n="s3_note"></div>
      </section>

      <!-- 4 MLIP 训练集 -->
      <section id="mlip">
        <h2><span class="num">4</span><span data-i18n="s4_h"></span></h2>
        <p class="lead" data-i18n="s4_lead"></p>
        <div class="grid2">
          <div class="card"><h3 data-i18n="s4_c1_h"></h3><p data-i18n="s4_c1_p"></p></div>
          <div class="card"><h3 data-i18n="s4_c2_h"></h3><p data-i18n="s4_c2_p"></p></div>
        </div>
        <div class="note" data-i18n="s4_note"></div>
      </section>

      <!-- 贡献 -->
      <section id="contribute">
        <h2><span class="num">＋</span><span data-i18n="s5_h"></span></h2>
        <p class="lead" data-i18n="s5_lead"></p>
        <ul>
          <li data-i18n="s5_l1"></li>
          <li data-i18n="s5_l2"></li>
        </ul>
        <div class="backrow"><a class="tbtn" href="index.html" data-i18n="back_cta"></a></div>
      </section>
    </main>
  </div>
</div>

<footer><div class="wrap"><span data-i18n="footer"></span></div></footer>

let LANG=localStorage.getItem('pcm_lang')||'zh';
function t(k){const v=I18N[LANG][k];return v!==undefined?v:k;}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=(LANG==='zh'?'使用文档 · 硫系存储材料数据库':'Documentation · Chalcogenide Memory Materials Database');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.innerHTML=t(e.dataset.i18n));
  document.getElementById('langBtn').textContent=LANG==='zh'?'EN':'中';
}
document.getElementById('langBtn').onclick=()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('pcm_lang',LANG);applyI18n();};

const rootEl=document.documentElement;
function curTheme(){return rootEl.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}
{const s=localStorage.getItem('pcm_theme');if(s)rootEl.setAttribute('data-theme',s);}
document.getElementById('themeBtn').onclick=()=>{
  rootEl.setAttribute('data-theme',curTheme()==='dark'?'light':'dark');
  localStorage.setItem('pcm_theme',curTheme());
};

// TOC scroll-spy
const secs=[...document.querySelectorAll('.doc section')];
const links=new Map([...document.querySelectorAll('.toc a')].map(a=>[a.getAttribute('href').slice(1),a]));
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){
    links.forEach(a=>a.classList.remove('active'));
    const a=links.get(e.target.id);if(a)a.classList.add('active');
  }});
},{rootMargin:'-20% 0px -70% 0px',threshold:0});
secs.forEach(s=>io.observe(s));

applyI18n();
</script>
